name: Sauvegarde de la base

# Export complet de la base Supabase (schéma + données), chiffré, conservé 90 jours dans les artefacts de ce dépôt (privés).
# Ne fait rien tant que les secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE ne sont pas posés (Settings › Secrets and variables › Actions).
#   SUPABASE_DB_URL   : Supabase › Project Settings › Database › Connection string (URI, « Session pooler » ou « Direct »), avec le mot de passe.
#   BACKUP_PASSPHRASE : une phrase longue, à garder ailleurs : sans elle, la sauvegarde est illisible.
# Restaurer : gpg -d --batch --passphrase "…" artesa-AAAA-MM-JJ.sql.gpg | psql "$SUPABASE_DB_URL"

on:
  schedule:
    - cron: '23 3 * * 1'   # chaque lundi à 03:23 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets présents ?
        id: check
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ] || [ -z "${{ secrets.BACKUP_PASSPHRASE }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT; echo "Secrets absents : sauvegarde désactivée."
          else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - name: Exporter la base (pg_dump 17)
        if: steps.check.outputs.skip != 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e PGCONNECT_TIMEOUT=20 postgres:17 pg_dump "$DB_URL" \
            --no-owner --no-privileges --schema=public --schema=private --schema=auth --schema=storage \
            --exclude-table-data='storage.objects' > artesa.sql
          ls -la artesa.sql
          test -s artesa.sql
      - name: Chiffrer
        if: steps.check.outputs.skip != 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "artesa-$(date +%F).sql.gpg" artesa.sql
          shred -u artesa.sql
      - name: Conserver (90 jours)
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-${{ github.run_id }}
          path: artesa-*.sql.gpg
          retention-days: 90
          if-no-files-found: error
